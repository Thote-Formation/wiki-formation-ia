<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Thotie Quest - Profil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        "surface": "#0b1326", "background": "#0b1326", "surface-dim": "#0b1326",
        "surface-bright": "#31394d", "surface-container-lowest": "#060e20",
        "surface-container-low": "#131b2e", "surface-container": "#171f33",
        "surface-container-high": "#222a3d", "surface-container-highest": "#2d3449",
        "on-surface": "#dae2fd", "on-surface-variant": "#cbc3d7",
        "outline": "#958ea0", "outline-variant": "#494454",
        "primary": "#d0bcff", "on-primary": "#3c0091", "primary-container": "#a078ff", "on-primary-container": "#340080",
        "secondary": "#44e2cd", "on-secondary": "#003731", "secondary-container": "#03c6b2", "on-secondary-container": "#004d44",
        "tertiary": "#e2c62d", "on-tertiary": "#393000", "tertiary-container": "#c4ab01", "on-tertiary-container": "#4a3f00",
        "error": "#ffb4ab", "error-container": "#93000a"
      },
      borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
      spacing: { gutter: "24px", "container-max": "1280px" },
      fontFamily: {
        "label-caps": ["Space Grotesk"], "body-md": ["Be Vietnam Pro"],
        "display-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"]
      }
    }}
  }
</script>
</head>
<body class="bg-background text-on-background min-h-screen flex font-body-md overflow-x-hidden">
<nav id="academy-sidebar" class="hidden md:flex flex-col gap-2 p-4 h-screen w-64 fixed left-0 top-0 bg-surface-container border-r-4 border-surface-container-highest shadow-2xl z-50"></nav>

<main class="flex-1 md:ml-64 p-6 md:p-10 max-w-[720px] mx-auto">
  <h2 class="font-headline-md text-2xl mb-8 flex items-center gap-2">
    <span class="material-symbols-outlined text-primary">person</span> Mon profil
  </h2>

  <div class="bg-surface-container rounded-3xl p-6 neo-bevel mb-6">
    <label class="text-sm text-on-surface-variant mb-2 block">Pseudo</label>
    <input id="pseudo-input" type="text" maxlength="20"
      class="w-full bg-surface-container-high border border-surface-container-highest rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary" />
  </div>

  <div class="bg-surface-container rounded-3xl p-6 neo-bevel mb-6">
    <label class="text-sm text-on-surface-variant mb-3 block">Avatar</label>
    <div id="avatar-grid" class="grid grid-cols-4 gap-4"></div>
  </div>

  <button id="save-btn" class="w-full bg-primary text-on-primary font-semibold py-3 rounded-xl neo-bevel">
    Enregistrer
  </button>
  <p id="save-confirm" class="text-secondary text-sm mt-3 text-center hidden">Profil enregistré ✓</p>
</main>

<script src="assets/state.js"></script>
<script>
  const A = window.Academy;
  let selectedAvatar = A.state.avatar;

  function renderAvatarGrid() {
    const grid = document.getElementById("avatar-grid");
    grid.innerHTML = Object.entries(A.AVATARS).map(([key, av]) => `
      <button data-key="${key}" class="avatar-choice aspect-square rounded-xl avatar-emoji text-white text-3xl border-2 ${selectedAvatar === key ? "border-secondary" : "border-transparent"}">
        ${av.emoji}
      </button>
    `).join("");
    document.querySelectorAll(".avatar-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedAvatar = btn.dataset.key;
        renderAvatarGrid();
      });
    });
  }

  A.renderSidebar("profil");
  document.getElementById("pseudo-input").value = A.state.pseudo;
  renderAvatarGrid();

  document.getElementById("save-btn").addEventListener("click", () => {
    const pseudo = document.getElementById("pseudo-input").value.trim() || "Toi";
    A.setProfile(pseudo, selectedAvatar);
    A.renderSidebar("profil");
    const c = document.getElementById("save-confirm");
    c.classList.remove("hidden");
    setTimeout(() => c.classList.add("hidden"), 2000);
  });
</script>
</body>
</html>
