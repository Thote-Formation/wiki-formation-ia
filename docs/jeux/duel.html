<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>IA Academy - Duel de l'IA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        "surface": "#0b1326", "background": "#0b1326", "surface-dim": "#0b1326",
        "surface-bright": "#31394d", "surface-container-lowest": "#060e20",
        "surface-container-low": "#131b2e", "surface-container": "#171f33",
        "surface-container-high": "#222a3d", "surface-container-highest": "#2d3449",
        "on-surface": "#dae2fd", "on-surface-variant": "#cbc3d7",
        "outline": "#958ea0", "outline-variant": "#494454",
        "primary": "#d0bcff", "on-primary": "#3c0091", "primary-container": "#a078ff", "on-primary-container": "#340080",
        "secondary": "#44e2cd", "on-secondary": "#003731", "secondary-container": "#03c6b2", "on-secondary-container": "#004d44",
        "tertiary": "#e2c62d", "on-tertiary": "#393000", "tertiary-container": "#c4ab01", "on-tertiary-container": "#4a3f00",
        "error": "#ffb4ab", "error-container": "#93000a"
      },
      borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
      spacing: { gutter: "24px", "container-max": "1280px" },
      fontFamily: {
        "label-caps": ["Space Grotesk"], "body-md": ["Be Vietnam Pro"],
        "display-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"]
      }
    }}
  }
</script>
</head>
<body class="bg-background text-on-background min-h-screen flex font-body-md overflow-x-hidden">
<nav id="academy-sidebar" class="hidden md:flex flex-col gap-2 p-4 h-screen w-64 fixed left-0 top-0 bg-surface-container border-r-4 border-surface-container-highest shadow-2xl z-50"></nav>

<main class="flex-1 md:ml-64 p-6 md:p-10 max-w-[880px] mx-auto">
  <a href="index.html" class="text-sm text-on-surface-variant hover:text-secondary flex items-center gap-1 mb-6">
    <span class="material-symbols-outlined text-[16px]">arrow_back</span> Retour au Hub
  </a>

  <div class="bg-secondary-container text-on-secondary-container rounded-2xl p-5 neo-bevel mb-8 inline-flex items-center gap-3">
    <span class="material-symbols-outlined">sports_esports</span>
    <h2 class="font-headline-md text-2xl">Duel de l'IA</h2>
  </div>

  <div class="bg-surface-container rounded-3xl p-8 neo-bevel border-t border-white/5">
    <p class="text-on-surface-variant mb-6">Affronter un adversaire sur un défi de prompt, en temps limité.</p>
    <div class="border-2 border-dashed border-outline-variant rounded-2xl p-10 text-center text-outline mb-6">
      <span class="material-symbols-outlined text-4xl mb-2 block">construction</span>
      Zone à remplacer par la vraie mécanique de jeu (ex. ton mini-jeu duel existant).
    </div>
    <button id="complete-btn" class="bg-primary text-on-primary font-semibold px-6 py-3 rounded-xl neo-bevel">
      Marquer comme terminé
    </button>
    <p id="done-msg" class="text-secondary text-sm mt-3 hidden">Module terminé, XP ajouté ✓</p>
  </div>
</main>

<script src="assets/state.js"></script>
<script>
  window.Academy.renderSidebar("duel");
  const btn = document.getElementById("complete-btn");
  const already = window.Academy.state.completedModules.includes("duel");
  if (already) {
    btn.textContent = "Déjà terminé ✓";
    btn.disabled = true;
    btn.classList.add("opacity-50");
  }
  btn.addEventListener("click", () => {
    window.Academy.completeModule("duel");
    window.Academy.renderSidebar("duel");
    btn.textContent = "Déjà terminé ✓";
    btn.disabled = true;
    btn.classList.add("opacity-50");
    document.getElementById("done-msg").classList.remove("hidden");
  });
</script>
</body>
</html>
