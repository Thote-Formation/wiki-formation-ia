<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Thote Formation - Accueil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        "surface": "#0b1326", "background": "#0b1326", "surface-dim": "#0b1326",
        "surface-bright": "#31394d", "surface-container-lowest": "#060e20",
        "surface-container-low": "#131b2e", "surface-container": "#171f33",
        "surface-container-high": "#222a3d", "surface-container-highest": "#2d3449",
        "on-surface": "#dae2fd", "on-surface-variant": "#cbc3d7",
        "outline": "#958ea0", "outline-variant": "#494454",
        "primary": "#d0bcff", "on-primary": "#3c0091", "primary-container": "#a078ff", "on-primary-container": "#340080",
        "secondary": "#44e2cd", "on-secondary": "#003731", "secondary-container": "#03c6b2", "on-secondary-container": "#004d44",
        "tertiary": "#e2c62d", "on-tertiary": "#393000", "tertiary-container": "#c4ab01", "on-tertiary-container": "#4a3f00",
        "error": "#ffb4ab", "error-container": "#93000a"
      },
      borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
      spacing: { gutter: "24px", "container-max": "1280px" },
      fontFamily: {
        "label-caps": ["Space Grotesk"], "body-md": ["Be Vietnam Pro"],
        "display-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"]
      }
    }}
  }
</script>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden">

<div id="tq-nav"></div>

<main class="max-w-[1280px] mx-auto px-4 md:px-8 py-12">

  <!-- Hero -->
  <section class="text-center max-w-2xl mx-auto mb-16">
    <h1 class="font-headline-md text-3xl md:text-4xl font-extrabold mb-4">
      Bienvenue sur <span class="text-primary">Thotie Formation</span>
    </h1>
    <p class="text-on-surface-variant text-lg">
      Ressources de la formation IA générative — Certification RS6776.
    </p>
  </section>

  <!-- Bandeau vers le jeu -->
  <a href="../jeux/index.html" class="flex flex-col md:flex-row items-center justify-between gap-4 bg-secondary-container text-on-secondary-container rounded-3xl p-6 md:p-8 neo-bevel mb-16">
    <div class="flex items-center gap-4">
      <span class="material-symbols-outlined text-4xl">stadia_controller</span>
      <div>
        <h2 class="font-headline-md text-xl mb-1">Thotie Quest</h2>
        <p class="text-sm text-on-secondary-container/80">Apprends en jouant : modules, XP, niveaux et défis.</p>
      </div>
    </div>
    <span class="bg-surface/20 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap">Jouer →</span>
  </a>

  <!-- Accès rapide aux sections -->
  <section>
    <h2 class="font-headline-md text-xl mb-6 flex items-center gap-2 text-secondary">
      <span class="material-symbols-outlined">explore</span> Explorer
    </h2>
    <div id="sections-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>

</main>

<div id="tq-footer"></div>

<script src="assets/shared.js"></script>
<script>
  TQ.init("accueil");

  // Grille construite à partir de la même config que la nav (TQ.NAV), pour rester synchronisée
  // automatiquement : dès qu'une section passe "built: true" dans shared.js, sa carte devient cliquable.
  const icons = {
    certification: "military_tech",
    formation: "school",
    outils: "construction",
    ressources: "library_books",
    glossaire: "menu_book",
  };
  const grid = document.getElementById("sections-grid");
  grid.innerHTML = TQ.NAV.filter((s) => s.id !== "accueil").map((s) => {
    const icon = icons[s.id] || "folder";
    if (!s.built) {
      return `<div class="locked-card bg-surface-container-high rounded-2xl p-5 neo-bevel">
        <div class="flex justify-between items-start mb-3">
          <div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center text-outline">
            <span class="material-symbols-outlined">${icon}</span>
          </div>
          <span class="text-[10px] uppercase text-outline">Bientôt</span>
        </div>
        <h3 class="font-headline-md text-[16px] text-outline-variant">${s.label}</h3>
      </div>`;
    }
    return `<a href="${s.href}" class="bg-surface-container rounded-2xl p-5 neo-bevel block group">
      <div class="w-12 h-12 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container mb-3 group-hover:rotate-12 transition-transform">
        <span class="material-symbols-outlined">${icon}</span>
      </div>
      <h3 class="font-headline-md text-[16px]">${s.label}</h3>
    </a>`;
  }).join("");
</script>
</body>
</html>
