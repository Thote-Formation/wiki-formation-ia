<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H2 — Stratégie d'implémentation | Thote V2</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="bg-deep-space text-on-surface">
  <div id="v2-app-layout" class="layout-3-cols">
    <aside id="v2-sidebar-left" class="sidebar-left"></aside>

    <main class="main-content">
      <header class="module-header glass-panel">
        <span class="badge-tag">Module H2</span>
        <h1>Stratégie d'implémentation IA</h1>
        <p class="subtitle">Auditer un poste, cartographier les besoins et choisir la bonne pile d'outils (Support Ex. 1 RS6776).</p>
      </header>

      <!-- Simulateur ROI (h2-interactivity.js) -->
      <section class="glass-panel content-box">
        <h3>📊 Simulateur d'Audit & Gain de Temps</h3>
        <div class="sim-grid">
          <div>
            <label for="sim-task-type">Tâche :</label>
            <select id="sim-task-type" class="v2-input">
              <option value="emails">Emails récurrents</option>
              <option value="pdf">Analyse de PDF/Procédures</option>
              <option value="schema">Création de schémas (Napkin)</option>
              <option value="social">Posts réseaux sociaux</option>
            </select>
          </div>
          <div>
            <label for="sim-hours">Temps hebdo :</label>
            <select id="sim-hours" class="v2-input">
              <option value="1">1h / sem</option>
              <option value="3" selected>3h / sem</option>
              <option value="5">5h / sem</option>
            </select>
          </div>
          <div>
            <label for="sim-plan">Formule :</label>
            <select id="sim-plan" class="v2-input">
              <option value="free">Gratuit / Freemium</option>
              <option value="pro">Abonnement Pro (20€)</option>
            </select>
          </div>
        </div>
        <div id="sim-result" class="sim-result-box"></div>
      </section>

      <!-- Quiz Outils (h2-interactivity.js) -->
      <section class="glass-panel content-box">
        <h3>🎯 Quiz : Quel outil pour quelle tâche ?</h3>
        <div id="quiz-progress" class="quiz-badge"></div>
        <div id="quiz-task" class="quiz-question"></div>
        <div id="quiz-choices" class="quiz-choices-list"></div>
        <div id="quiz-feedback" class="quiz-feedback-box" style="display:none;"></div>
        <div class="quiz-controls">
          <button type="button" id="quiz-next" class="btn-primary-v2" style="display:none;">Suivant ➔</button>
          <button type="button" id="quiz-reset" class="btn-secondary-v2" style="display:none;">🔄 Recommencer</button>
        </div>
        <div id="quiz-score" class="quiz-score-box" style="display:none;"></div>
      </section>

      <!-- Validation -->
      <section class="glass-panel validate-card">
        <h3>🎉 Valider le Module H2</h3>
        <button class="btn-cyan" onclick="ThoteQuest.completeQuest('h2_complete')">Valider le module (+100 XP)</button>
      </section>
    </main>

    <aside id="v2-sidebar-right" class="sidebar-right"></aside>
  </div>

  <script src="../assets/shared.js"></script>
  <script src="../assets/h2-interactivity.js"></script>
</body>
</html>
