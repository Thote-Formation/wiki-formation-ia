site_name: Wiki Formation IA générative
site_url: https://pierre-l-hue.github.io/wiki-formation-ia/
site_description: Ressources de la formation IA générative — Certification RS6776
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: fr
  font:
    text: Poppins
    code: Roboto Mono
  palette:
    # Mode Clair — Palette Haute Lisibilité (WCAG AAA / AA)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo           # Bleu profond (ratio de contraste élevé > 7:1)
      accent: deep orange       # Orange soutenu pour les éléments interactifs
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre

    # Mode Sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
      
  features:
    - navigation.tabs           # Onglets principaux en haut (Accueil, Certification, Ressources...)
    - navigation.tabs.sticky    # Garde la barre d'onglets visible au scroll
    - navigation.indexes        # Permet de cliquer sur une catégorie pour ouvrir son index.md
    - navigation.top            # Bouton de retour en haut de page
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_javascript:
  - javascripts/index.js
  - javascripts/certification-rs6776.js
  - javascripts/h1-interactivity.js
  - javascripts/h2-interactivity.js
  - javascripts/h3-interactivity.js
  - javascripts/h4-interactivity.js
  - javascripts/h5-interactivity.js
  - javascripts/h6-interactivity.js
  - javascripts/h7-interactivity.js
  - javascripts/cas-pratiques.js
  - javascripts/auth.js
  - javascripts/progress.js
  - javascripts/prompt-generator.js
  - javascripts/prompting-avance.js
  - javascripts/contexte-memoire.js
  - javascripts/reduction-hallucinations.js
  - javascripts/quiz-final.js
  - javascripts/evaluation-entree.js
  - javascripts/agent-simulator.js
  - javascripts/chatbot.js
extra_css:
  - stylesheets/extra.css

nav:
  - Accueil: index.md

  - Certification RS6776:
      - Présentation: certification-rs6776.md
      - Évaluation d'entrée: evaluation-entree.md

  - Parcours de formation:
      - H0 — Lancement: formation/h0.md
      - H1 — Fondamentaux IA + ROFT: formation/h1.md
      - H2 — Stratégie d'implémentation IA: formation/h2.md
      - H3 — Structurer un prompt efficace: formation/h3.md
      - H4 — Créer des visuels attractifs: formation/h4.md
      - H5 — Confidentialité et sécurité: formation/h5.md
      - H6 — Accessibilité et inclusivité: formation/h6.md
      - H7 — Éthique, IA Act, biais: formation/h7.md
      - Quiz final: formation/quiz-final.md

  - Outils:
      - Vue d'ensemble: outils-interactifs/index.md
      - Générateur CROFT: outils-interactifs/generateur-croft.md
      - Masqueur RGPD: outils-interactifs/anonymiseur.md
      - Prompt Visuel: outils-interactifs/generateur-visuel.md
      - Anti-Hallucinations: outils-interactifs/anti-hallucinations.md
      - Calculateur de Tokens: outils-interactifs/calculateur-tokens.md
      - Audit Biais & Inclusivité: outils-interactifs/audit-biais.md
      - Formateur JSON/CSV/MD: outils-interactifs/formateur-donnees.md
      

  - Ressources:
      - Cas pratiques:
          - Vue d'ensemble: cas-pratiques/index.md
          - Assistant administratif: cas-pratiques/assistant-administratif.md
          - Communication: cas-pratiques/communication.md
          - Ressources humaines: cas-pratiques/rh.md

      - Templates et méthodes:
          - Anonymisation: anonymisation.md
          - Prompt CROFT: prompt-croft.md
          - Prompt visuel: prompt-visuel.md
          - Audit de biais: audit-biais.md
          - Checklist accessibilité: checklist-accessibilite.md

      - Comparatifs IA:
          - Comparatif LLM: outils/comparatif.md
          - ChatGPT: outils/chatgpt.md
          - Claude: outils/claude.md
          - Gemini: outils/gemini.md
          - Mistral: outils/mistral.md
          - Copilot: outils/copilot.md
          - Perplexity: outils/perplexity.md
          - 4D Fluency: outils/4d-fluency.md

      - Veille et approfondissement:
          - Sources officielles: sources-officielles.md
          - Vue d'ensemble: articles/index.md
          - Prompting avancé (Few-shot & CoT): articles/prompting-avance.md
          - Gestion du contexte & mémoire: articles/contexte-memoire.md
          - Réduire les hallucinations: articles/reduction-hallucinations.md
          - Les Agents IA: articles/agents-rag.md

  - Glossaire: glossaire.md

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: false
      anchorlink: false
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.emoji
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html

copyright: >
  Conforme à l'IA Act Européen (Risque Limité) : ce site intègre des outils d'assistance et de génération basés sur l'intelligence artificielle.
